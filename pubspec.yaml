name: flutter_equipo2
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.7.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.0
  uuid: ^4.5.3
